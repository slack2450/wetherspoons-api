name: Publish to npm

on:
  release:
    # Published also fires when a reviewed draft is made public; `created`
    # does not fire for draft releases.
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test

      # This is deliberately the real network-backed suite. Never replace it
      # with mocks, skipping, continue-on-error, or a soft-failure wrapper.
      - name: Test every live Wetherspoons venue
        env:
          WETHERSPOONS_API_TOKEN: ${{ secrets.WETHERSPOONS_API_TOKEN }}
        run: npm run test:live
        timeout-minutes: 90

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
