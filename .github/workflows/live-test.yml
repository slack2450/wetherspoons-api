name: Live Wetherspoons API tests

on:
  schedule:
    # GitHub cron is UTC. Trigger at both possible UTC offsets, then keep only
    # the invocation which is 15:00 in Europe/London.
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  schedule_window:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.window.outputs.should_run }}
    steps:
      - name: Select the 15:00 Europe/London invocation
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" || "$(TZ=Europe/London date +%H)" == "15" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  live_test:
    needs: schedule_window
    if: needs.schedule_window.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hammer every live Wetherspoons venue
        run: npm run test:live
