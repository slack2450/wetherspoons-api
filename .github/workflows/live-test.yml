name: Live Wetherspoons API tests

on:
  schedule:
    # GitHub cron is UTC. A single fixed invocation cannot be skipped merely
    # because a hosted runner starts late.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live_test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Each matrix entry still hammers every real venue. Serial execution
      # avoids turning the compatibility matrix into concurrent upstream load.
      max-parallel: 1
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hammer every live Wetherspoons venue
        env:
          WETHERSPOONS_API_TOKEN: ${{ secrets.WETHERSPOONS_API_TOKEN }}
        run: npm run test:live
