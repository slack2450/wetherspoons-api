name: Live Wetherspoons API tests

on:
  schedule:
    # GitHub cron is UTC. A single fixed invocation cannot be skipped merely
    # because a hosted runner starts late.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-wetherspoons-api
  cancel-in-progress: false

jobs:
  live_test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Each matrix entry still hammers every real venue. Serial execution
      # avoids turning the compatibility matrix into concurrent upstream load.
      max-parallel: 1
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hammer every live Wetherspoons venue
        run: npm run test:live
